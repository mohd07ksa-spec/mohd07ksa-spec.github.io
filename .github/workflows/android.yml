name: بناء تطبيق الأندرويد
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk academy.apk
          cp android/online/build/outputs/apk/debug/online-debug.apk academy-online.apk
          cp android/analyzer/build/outputs/apk/debug/analyzer-debug.apk aqar-analyzer.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: الأكاديمية ${{ github.run_number }}
          files: |
            academy.apk
            academy-online.apk
            aqar-analyzer.apk
          make_latest: true
