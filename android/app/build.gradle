plugins { id 'com.android.application' }
android {
    namespace 'com.mohd.academy'
    compileSdk 34
    signingConfigs {
        shared { storeFile rootProject.file('keystore/academy.jks'); storePassword 'academy123'; keyAlias 'academy'; keyPassword 'academy123' }
    }
    defaultConfig {
        applicationId "com.mohd.academy"
        minSdk 21
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    buildTypes { debug { minifyEnabled false; signingConfig signingConfigs.shared } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
