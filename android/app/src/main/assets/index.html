:root{--bg:#0E1620;--bg2:#131E2B;--card:#1C2A39;--card2:#233447;--line:#2E4157;--txt:#F5F3EE;--mut:#9AAABB;--blue:#8FA8C2;--y:#FFCC4D;--ok:#4FD18B;--okbg:#12352A;--bad:#FF6B6B;--badbg:#3A1C22;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:T,system-ui,sans-serif;direction:rtl;min-height:100%}
body{font-size:16px;line-height:1.65;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;font-size:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-weight:900;font-size:19px;line-height:1.2}.brand span{color:var(--y)}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:2px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.pill b{color:var(--y)}
.hero{background:linear-gradient(135deg,#1C2A39,#16222F);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,204,77,.18),transparent 70%)}
.hero .k{color:var(--blue);font-size:13px;font-weight:700}
.hero h1{font-size:23px;font-weight:900;line-height:1.35;margin:4px 0 10px}
.hero h1 span{color:var(--y)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px}
.stat{background:rgba(14,22,32,.55);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--y);line-height:1.2}
.stat span{font-size:12px;color:var(--mut)}
.bar{height:9px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#FFCC4D,#FFB020);border-radius:99px;transition:width .5s}
.bar.g i{background:linear-gradient(90deg,#4FD18B,#2FB872)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--y);color:#1C2A39;font-weight:900;font-size:17px;border-radius:16px;padding:15px 16px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
h2{font-size:18px;font-weight:900;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:6px;height:18px;background:var(--y);border-radius:3px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.unit{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:right;display:flex;flex-direction:column;gap:6px;transition:border-color .2s}
.unit:hover{border-color:var(--blue)}
.unit .ic{font-size:24px}
.unit b{font-size:16px;font-weight:900;line-height:1.35}
.unit p{font-size:13px;color:var(--mut);line-height:1.5;flex:1}
.unit .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.unit .lv{color:var(--y);font-weight:700}
.note{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--y);border-radius:14px;padding:14px;font-size:14px;margin-bottom:14px}
.note b{color:var(--y)}
.x{float:left;color:var(--mut);font-size:20px;line-height:1;padding:0 4px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qtop .bar{flex:1}
.close{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px;flex:none}
.combo{font-weight:900;color:var(--y);font-size:14px;min-width:44px;text-align:center}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);background:rgba(143,168,194,.12);border-radius:8px;padding:2px 9px;margin-bottom:8px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px}
.qtext{font-size:20px;font-weight:700;line-height:1.55;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;text-align:right;font-size:16px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;transition:all .15s}
.opt:hover{border-color:var(--blue)}
.opt .n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--blue)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .n{background:var(--ok);color:#0E1620}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .n{background:var(--bad);color:#0E1620}
.opt.dim{opacity:.5}
.opt.picked .n{background:var(--y);color:#1C2A39}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:900;font-size:18px;padding:18px}
.fb{margin-top:14px;border-radius:18px;padding:16px;animation:pop .25s ease}
.fb.ok{background:var(--okbg);border:1px solid #2a6b50}.fb.bad{background:var(--badbg);border:1px solid #6b2a35}
.fb h3{font-size:18px;font-weight:900;margin-bottom:6px}
.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.fb .ans{font-weight:700;margin-bottom:8px}
.fb p{font-size:15px;margin-bottom:8px}
.fb .lbl{font-size:12px;font-weight:900;color:var(--y);display:block;margin-top:10px}
.fb .eg{background:rgba(0,0,0,.2);border-radius:10px;padding:8px 10px;font-size:14px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .btn{flex:1}
.ask{background:transparent;border:1px dashed var(--blue);color:var(--blue);border-radius:14px;padding:11px;font-weight:700;font-size:14px;flex:0 0 auto}
.xp{position:fixed;top:30%;left:50%;transform:translateX(-50%);font-size:28px;font-weight:900;color:var(--y);pointer-events:none;animation:fly 1s ease forwards;z-index:50}
@keyframes fly{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}
.ord .opt.picked{border-color:var(--y)}
.end{text-align:center;padding:30px 10px}
.end .big{font-size:60px;line-height:1}
.end h1{font-size:26px;font-weight:900;margin:10px 0}

<script>const OFFLINE_BUILD=1;
const UNITS_A = [
{
 id:"views", icon:"📈", title:"هندسة المشاهدات", desc:"كيف المنصة توزّع الفيديو، ووش يخلي الناس يوقفون ويكمّلون",
 summary:[
  "المنصة توزّع على حسب سلوك المشاهد: وقف؟ كمّل؟ حفظ؟ شارك؟ مو على حسب الكاميرا ولا عدد المتابعين.",
  "التوزيع على دفعات: دفعة صغيرة ← قياس ← دفعة أكبر لو الأداء أعلى من المعتاد.",
  "المقارنة نسبية: فيديوك ينقارن بالفيديوهات المشابهة، والمحتوى العقاري الحالي ضعيف، فالفرصة كبيرة.",
  "الحساب لازم يتكلم مع جمهور واحد واضح، عشان المنصة تعرف لمين تعرضه.",
  "المعادلة: افتتاحية توقف + محتوى يمسك + سبب للحفظ أو المشاركة = مشاهدات."
 ],
 qs:[
 {t:"mcq",q:"على أي أساس تقرر المنصة توزّع الفيديو على ناس أكثر؟",o:["جودة الكاميرا ودقة التصوير","سلوك المشاهدين مع الفيديو: يوقفون، يكمّلون، يحفظون، يشاركون","عدد متابعين الحساب","عدد الهاشتاقات"],a:1,ex:"المنصة تعرض الفيديو على دفعة صغيرة وتراقب وش يسوون. إذا وقفوا وكمّلوا وحفظوا، توسّع العرض. الكاميرا والمتابعين تأثيرهم أقل بكثير من سلوك الناس.",eg:"حساب فيه 2,000 متابع ينزل فيديو يجيب 150 ألف، لأن الناس كمّلوه وشاركوه.",why:"لما العميل يقول «نبي كاميرا أحسن»، تعرف إن المشكلة غالبًا مو هنا."},
 {t:"tf",q:"المنصة تعرض الفيديو على كل المتابعين مرة وحدة أول ما ينزل.",a:false,ex:"غلط. تعرضه على دفعة صغيرة أول، وتقيس الأداء، وإذا كان أعلى من المعتاد تعطيه دفعة أكبر. لهذا تشوف فيديو يجيب 200 ألف وجنبه فيديو يجيب 800 في نفس الحساب.",why:"تفهم ليش النتائج تختلف بين فيديو وفيديو في نفس الحساب."},
 {t:"mcq",q:"المنصة لما تقيّم فيديوك، تقارنه بإيش؟",o:["بأفضل فيديو في التطبيق كله","بالفيديوهات المشابهة اللي تتنافس على نفس الجمهور","بفيديوهاتك القديمة بس","ما تقارنه بشيء"],a:1,ex:"المقارنة نسبية: هل فيديوك أحسن من الفيديوهات المشابهة في نفس اللحظة؟ وبما إن أغلب المحتوى العقاري كتالوج ضعيف، الفيديو المبني صح يتفوّق بسهولة.",why:"هذي الفرصة اللي تبيعها: المعيار في السوق العقاري منخفض."},
 {t:"mcq",q:"وش أول إشارة، وأهمها، تحدد مصير الفيديو؟",o:["عدد اللايكات","هل المشاهد وقف أصلًا عند الفيديو (أول 1–3 ثواني)","طول الفيديو","وقت النشر"],a:1,ex:"إذا المشاهد قلّب وما وقف، ما يصير أي شيء بعدها: لا مشاهدة كاملة ولا حفظ ولا مشاركة. لهذا أول 3 ثواني أهم جزء في الفيديو.",eg:"فيديو يبدأ بلقطة واجهة وشعار الشركة = أغلب الناس يقلّبون.",why:"أول شي تحلله في أي حساب عميل: أول 3 ثواني من فيديوهاته."},
 {t:"mcq",q:"فيديو A مدته 30 ثانية والناس يشوفون منه 25. فيديو B مدته 60 ثانية والناس يشوفون منه 15. أيهم أقوى عند المنصة؟",o:["B لأنه أطول","A لأن نسبة المشاهدة أعلى","نفس الشيء","ما نقدر نعرف"],a:1,ex:"المنصة تهتم بكم من الفيديو انشاف، مو كم مدته. A انشاف منه 83%، وB انشاف منه 25% بس.",why:"تختصر فيديوهات العميل بدل ما تطوّلها."},
 {t:"mcq",q:"أي إشارة تعتبر الأقوى لأنها تجيب جمهور جديد من برا المنصة؟",o:["اللايك","المشاركة (إرسال الفيديو لشخص ثاني)","المشاهدة","المتابعة"],a:1,ex:"المشاركة معناها إن المشاهد يبي غيره يشوف الفيديو، وتجيب ناس من برا دائرة المنصة. والعقار موضوع عائلي، فالفيديو اللي يستاهل يترسل للزوجة أو الشريك عنده فرصة طبيعية.",eg:"«أرسله لشريكك قبل ما تقررون»",why:"تبني فيديوهات العميل بحيث فيها سبب يخلي الناس يرسلونها."},
 {t:"tf",q:"الحفظ إشارة ضعيفة ما لها تأثير على التوزيع.",a:false,ex:"غلط. الحفظ يقول للمنصة «هذا محتوى له قيمة طويلة، برجع له». والمحتوى التعليمي (قوائم تشييك، مقارنات، أخطاء) ينحفظ أكثر بكثير من العروض.",why:"هذا سبب إن التعليمي 6 من 14 في باقة النمو."},
 {t:"mcq",q:"حساب ينزل يوم عن مستثمرين، ويوم ديكور، ويوم تهنئة عيد، ويوم عرض شقة. وش المشكلة؟",o:["ما فيه مشكلة، التنوع زين","المنصة تحتار لمين تعرضه، فتعرضه على ناس غلط وتنزل النتائج","المشكلة في المونتاج","لازم ينشر أكثر"],a:1,ex:"كل فيديو يعلّم المنصة «لمين أعرض هذا الحساب». لما المواضيع متشتتة، المنصة ما تعرف الجمهور، فتعرضه على ناس ما يهمهم فيقلّبون.",why:"لهذا الخطة الشهرية جزء أساسي من خدمتك، مو إضافة."},
 {t:"mcq",q:"شركة كانت تنشر بانتظام ووقفت شهرين. وش يصير غالبًا لما ترجع؟",o:["ترجع بنفس قوتها","الحساب يرجع تقريبًا من الصفر، والمنصة تعامله كأنه جديد","تزيد المشاهدات لأن الناس اشتاقوا","ما يتغير شيء"],a:1,ex:"المنصة تعطي فرصة أكبر للحسابات المنتظمة. الانقطاع يضعف الثقة اللي بناها الحساب مع المنصة، والرجوع يحتاج وقت.",eg:"حساب وقف من منتصف سبتمبر، ولما يرجع تجيه أرقام أقل من قبل.",why:"من أقوى نقاط البيع: 14 فيديو بالشهر = حضور ثابت ما ينقطع."},
 {t:"mcq",q:"وش المعادلة الأساسية للمشاهدات؟",o:["كاميرا قوية + موسيقى ترند","افتتاحية توقف + محتوى يمسك + سبب للحفظ أو المشاركة","نشر 3 مرات يوميًا","هاشتاقات كثيرة + وقت نشر صح"],a:1,ex:"كل فيديو ضعيف تلقاه مكسور في وحدة من الثلاث: إما الافتتاحية ما وقّفت أحد، أو المحتوى ما مسك، أو ما فيه سبب يخليه ينحفظ.",why:"هذي عدسة التحليل اللي تستخدمها مع كل فيديو."},
 {t:"tf",q:"الهاشتاقات من أهم أسباب انتشار الفيديو العقاري.",a:false,ex:"غلط. تأثيرها ضعيف مقارنة بسلوك المشاهد. فيديو قوي بدون هاشتاقات ينتشر، وفيديو ضعيف بعشرين هاشتاق ما ينتشر.",why:"ما تضيع وقتك ولا وقت العميل فيها."},
 {t:"mcq",q:"وقت النشر بالدقيقة، وش تأثيره؟",o:["هو أهم عامل","يفرق شوي، لكن فيديو ضعيف في أحسن وقت يظل ضعيف","ما له أي تأثير","يحدد كل شيء في أول ساعة"],a:1,ex:"وقت النشر يساعد على الهامش، لكنه ما ينقذ فيديو ضعيف ولا يقتل فيديو قوي. التركيز يكون على الافتتاحية والمحتوى.",why:"لما العميل يسأل «متى ننشر؟» تجاوبه بدون ما تعطيها أكبر من حجمها."},
 {t:"mcq",q:"ليش الحسابات اللي فيها شخص يتكلم تبني ثقة أسرع؟",o:["لأن المنصة تحب الوجوه بشكل خاص","لأن الناس تشتري من ناس، والوجه يعطي إحساس إن ورا الحساب أحد حقيقي","لأنها أرخص","ما تبني ثقة أسرع"],a:1,ex:"العقار قرار كبير، والمشتري يبي يرتاح للي قدامه. الوجه يحوّل الشركة من «شعار» لـ«ناس أعرفهم». ولهذا نوع «الثقة» فيه «وجه الشركة».",why:"تقنع العميل يطلع موظف منهم في الفيديوهات."},
 {t:"tf",q:"اللايكات لحالها مؤشر قوي إن الفيديو نجح.",a:false,ex:"غلط. اللايك أرخص إشارة: الواحد يضغطها وهو يقلّب. ما تعني إنه شاف الفيديو كامل ولا إنه وثق في الشركة. المهم: وقت المشاهدة، والحفظ، والمشاركة.",why:"في التقرير الشهري ما تبني نجاحك على اللايكات."},
 {t:"mcq",q:"ليش الفيديو العقاري «المتوسط الجودة لكن المبني صح» يقدر يتفوّق بسرعة؟",o:["لأن المنصة تفضّل العقار","لأن أغلب المنافسين ينشرون كتالوجات ضعيفة، فالمعيار منخفض","لأن الناس تحب الجودة الضعيفة","ما يقدر يتفوّق"],a:1,ex:"المقارنة نسبية بين الفيديوهات المشابهة. لما المنافسين كلهم «فيلا للبيع، 5 غرف»، أي فيديو فيه افتتاحية وقصة يبرز.",why:"هذي الجملة تقولها للعميل كفرصة: السوق فاضي من المحتوى الذكي."},
 {t:"mcq",q:"العميل يقول: «فيديوهاتنا ما تجيب مشاهدات، نبي نشتري كاميرا أغلى». وش ردك كخبير؟",o:["صح، الكاميرا هي الحل","المشكلة غالبًا في أول 3 ثواني وطريقة الكلام، مو الكاميرا. خلني أوريك وين يطلع الناس","اشتروا إضاءة بدل الكاميرا","زيدوا عدد الفيديوهات"],a:1,ex:"أغلب مشاكل المشاهدات في الافتتاحية والاستمرار. الجوال الحديث يكفي. وهذا بالضبط اللي تبيعه: هندسة انتباه، مو معدات.",why:"هذا الرد يحوّلك من «مونتير» لـ«خبير» في عين العميل."},
 {t:"tf",q:"المحتوى التعليمي ينحفظ أكثر من فيديوهات العروض العقارية.",a:true,ex:"صح. الناس يحفظون اللي بيرجعون له: «5 أشياء تشيّكها قبل الاستلام»، مقارنة أحياء. أما العرض فيشوفونه مرة ويمشون.",why:"تبرر للعميل ليش نسوي تعليمي وما نكتفي بالعروض."},
 {t:"mcq",q:"وش يعني إن المنصة «تتعلم» مين جمهور الحساب؟",o:["تقرأ البايو","كل فيديو ومين تفاعل معه يعلّمها لمين تعرض الحساب بعدين","تسأل صاحب الحساب","تعتمد على الموقع الجغرافي بس"],a:1,ex:"مع كل فيديو، المنصة تشوف مين وقف وكمّل وتفاعل، وتبني صورة عن جمهور الحساب. الحساب الواضح الموضوع يوصل أسرع للجمهور الصح.",why:"تفهم ليش الثبات في الموضوع أهم من «التنويع العشوائي»."}
 ]
},
{
 id:"hooks", icon:"🎣", title:"الافتتاحيات والسكربت", desc:"أول 3 ثواني، والحلقة المفتوحة، والمعنى قبل المواصفات",
 summary:[
  "الافتتاحية 3 طبقات لازم تتفق: اللي ينقال، واللي ينكتب على الشاشة، واللي ينشاف.",
  "6 أنواع تشتغل في العقار: الخطأ، الرقم المفاجئ، المقارنة، السر، السؤال المباشر، القصة.",
  "الافتتاحية لازم تكون صادقة: الوعد اللي ما يتحقق يقتل الحساب.",
  "الحلقة المفتوحة: افتح سؤال بالبداية وجاوبه بالآخر.",
  "المعنى قبل المواصفات: «350 متر» معلومة، «كل ولد له غرفته» قصة.",

 ],
 qs:[
 {t:"mcq",q:"وش الطبقات الثلاث للافتتاحية اللي لازم تتفق مع بعض؟",o:["الموسيقى، والفلتر، والشعار","اللي ينقال، واللي ينكتب على الشاشة، واللي ينشاف","العنوان، والهاشتاق، والوصف","الصوت، والإضاءة، والكاميرا"],a:1,ex:"ناس كثير يشوفون بدون صوت، فالنص على الشاشة لازم يحمل الفكرة. واللقطة لازم تثبت الجملة: إذا قلت «هذا المطبخ فيه غلطة»، اللقطة تكون على مكان الغلطة.",why:"أكثر غلطة تشوفها: جملة قوية ولقطتها واجهة عمارة."},
 {t:"mcq",q:"أي افتتاحية أقوى؟",o:["«السلام عليكم، معكم شركة الديار، اليوم بنوريكم فيلا مميزة»","«فيلا للبيع في حي النرجس، 5 غرف و3 حمامات»","«هذي الفيلا فيها غلطة تصميم، أغلب المشترين ما ينتبهون لها»","«تابعونا للمزيد من العروض»"],a:2,ex:"الثالثة تفتح فضول («وش الغلطة؟») وتلمس خوف المشتري من الغلط. الأولى والثانية ما تعطي سبب للتوقف، والرابعة طلب بدون قيمة.",why:"هذا النوع اللي بتكتبه لعملائك كل يوم."},
 {t:"mcq",q:"«لا توقع على شقة قبل ما تشيّك هذا الشيء». أي نوع افتتاحية هذي؟",o:["الرقم المفاجئ","الخطأ","القصة","المقارنة"],a:1,ex:"افتتاحية الخطأ تشتغل لأن العقار أكبر قرار مالي، والناس تخاف تغلط فيه.",why:"من أقوى الأنواع في العقار تحديدًا."},
 {t:"mcq",q:"«بـ900 ألف، هذا اللي تقدر تاخذه في شمال جدة اليوم». أي نوع؟",o:["الرقم المفاجئ","السر","السؤال المباشر","الخطأ"],a:0,ex:"الرقم يوقف العين، خصوصًا لما يكون سعر يهم الناس ويخليهم يقارنون بميزانيتهم.",why:"افتتاحية سهلة التنفيذ لأي عقار عند العميل."},
 {t:"mcq",q:"«سمسار ما بيقولك هذا عن الشقق الأرضية». أي نوع؟",o:["المقارنة","السر أو المعلومة الداخلية","القصة","الخطأ"],a:1,ex:"فضول المعرفة: الناس يحبون يعرفون اللي «ما ينقال». بس لازم المعلومة تكون حقيقية ومفيدة فعلًا.",why:"يبني صورة «هذولا يقولون الصدق»."},
 {t:"mcq",q:"«عميل كان بيشتري هذي الشقة، ورجع عن قراره في آخر دقيقة». أي نوع؟",o:["القصة","الرقم","السؤال","السر"],a:0,ex:"القصة تخلي المشاهد يبي يعرف «وش صار؟» فيكمّل للآخر.",why:"القصص تبني ثقة وتنحفظ."},
 {t:"tf",q:"عادي أكتب افتتاحية قوية حتى لو الفيديو ما يوفي بوعدها، المهم يوقف المشاهد.",a:false,ex:"غلط. المشاهد يحس إنه انخدع فيطلع، والمنصة تفهم إن الفيديو مخيب. ومع الوقت الحساب يفقد ثقة الناس والمنصة.",why:"الصدق في الافتتاحية جزء من سمعتك وسمعة عميلك."},
 {t:"mcq",q:"وش هي «الحلقة المفتوحة»؟",o:["فيديو يعيد نفسه","سؤال أو وعد تفتحه بالبداية ولا تجاوبه إلا بالآخر","رابط في البايو","موسيقى تتكرر"],a:1,ex:"مثل: «فيه 3 أشياء تفرق بين الشقة اللي تتأجر بسرعة واللي تقعد شهور، والثالث أغلب الملاك ما ينتبهون له». المشاهد يكمّل عشان «الثالث».",why:"أقوى أداة لرفع نسبة المشاهدة."},

 {t:"mcq",q:"في خطوة «الوضع»، وش الصح؟",o:["تسأل سؤالين ثلاثة في جملة وحدة","تسأل سؤال واحد كل مرة، وتكتب كلماته بالضبط","تشرح خدمتك بين الأسئلة","تقاطعه بالحلول"],a:1,ex:"سؤال واحد، وتسمع، وتقول «واضح» أو «فاهمك». وتكتب كلماته لأنك بتستخدمها في التلخيص والحل.",why:"كلماته هي سلاحك في الخطوة 6."},
 {t:"mcq",q:"وش «السؤال الذهبي» في خطوة الألم؟",o:["«كم ميزانيتكم؟»","«ولو استمر الوضع كذا 6 شهور، وش يصير؟»","«تبون تشتغلون معي؟»","«مين المسؤول؟»"],a:1,ex:"يخليه يتخيل تكلفة عدم التغيير بنفسه. لما يقولها بلسانه («المنافسين بياكلونا») يقتنع أكثر من أي كلام منك.",why:"أقوى سؤال في المكالمة كلها."},
 {t:"mcq",q:"العميل قال: «الفيديو ياخذ يوم كامل ويجيب ألف مشاهدة». وش أحسن رد؟",o:["«أنا أحلها لك!»","«يوم كامل، وفي النهاية ألف مشاهدة؟» وتسكت","«هذا طبيعي»","«خلني أشرح خدمتي»"],a:1,ex:"تعكس كلامه وتسكت، فيكمل ويعمّق الألم بنفسه. القفز للحل بدري يضيع اللحظة.",why:"كل ما تكلم أكثر، اقتنع أكثر."},
 {t:"mcq",q:"وش السؤال اللي تسأله في خطوة «الهدف»؟",o:["«كم تبون متابعين؟»","«لو بعد 3 شهور صار حسابكم مثل ما تبغى، كيف يكون شكله؟ وش يتغير؟»","«متى تبون تبدأون؟»","«كم تدفعون حاليًا؟»"],a:1,ex:"هو يرسم النتيجة بنفسه، وبعدها «وش أهم شيء عندك من هذا؟». الهدف بكلماته يصير هو المعيار اللي تبيع عليه.",why:"الحل في الخطوة 6 يربط على هذا الهدف."},
 {t:"mcq",q:"ليش التلخيص (الخطوة 5) ضروري؟",o:["عشان تطوّل المكالمة","يتأكد إنك فهمته، ويحس إنك سمعته، وكل اللي بعده يكون له أساس","عشان تتذكر","مو ضروري"],a:1,ex:"«خلني أتأكد إني فهمتك: …. صح؟» بعد «صح» يكون موافق على المشكلة والهدف، فالحل يجي طبيعي.",why:"بدون التلخيص، العرض يطلع بدون أساس."},
 {t:"mcq",q:"وش الملاحظة الخبيرة الصح بعد التلخيص؟",o:["«محتواكم ضعيف»","«شفت حسابكم، وأغلب الفيديوهات تبدأ بلقطة واجهة، وأفضل فيديو عندكم كان فيه رقم كبير وجاب 3,500»","«أنا أفضل من الوكالة»","«حسابكم حلو بس ناقص»"],a:1,ex:"ملاحظة محددة بأرقام من حسابه تثبت إنك درست حسابه، وتخليه يشوفك خبير.",why:"هذي اللحظة اللي يتحول فيها من «يسمع» إلى «يثق»."},
 {t:"mcq",q:"في خطوة «الحل»، وش الأهم؟",o:["تشرح كل التفاصيل التقنية","تستخدم كلماته هو («يوم كامل»، «بدون ما نشيل همه»)، وتوضح الحدود","تقارن نفسك بالمنافسين","تتكلم عن خبرتك"],a:1,ex:"الحل بكلماته يحس إنه مفصّل عليه. والحدود («ما أدير الحساب ولا أرد على العملاء») توضح التوقعات.",why:"العميل يشتري حل مشكلته، مو قائمة خدمات."},
 {t:"tf",q:"بعد ما تقول السعر، الأفضل تبرر وتشرح ليش السعر كذا على طول.",a:false,ex:"غلط. قل الرقم بثقة واسكت، حتى لو طال السكوت 5 ثواني. التبرير قبل ما يرد يبين إنك مو واثق.",why:"أول واحد يتكلم بعد السعر هو اللي يتنازل."},
 {t:"mcq",q:"بأي باقة تبدأ في المكالمة؟",o:["الأساسية لأنها أرخص","النمو، دايمًا","تسأله وش يبي","ما تذكر باقات"],a:1,ex:"تبدأ بالنمو (14+5 بـ6,000). إذا قال «غالي» تنزل للأساسية. البداية بالأرخص تخليك ما تقدر تطلع.",why:"قاعدة ثابتة في التسعير."},
 {t:"mcq",q:"العميل قال: «أرسل لي وأشوف». وش تسوي؟",o:["«تمام، مع السلامة»","«أكيد، أرسل لك العرض اليوم. يناسبك نتكلم الأحد الساعة 4 وتقول لي قرارك؟»","تضغط عليه يقرر الحين","ما ترسل شيء"],a:1,ex:"توافق وترسل، لكن تحدد موعد محدد بيوم وساعة. «نتواصل» بدون موعد = غالبًا ما فيه تواصل.",why:"القاعدة: لا تخلي العميل يقفل المكالمة."},
 {t:"tf",q:"في النص الأول من المكالمة، الأفضل إنك أنت اللي تتكلم أكثر عشان يعرفك.",a:false,ex:"غلط. العميل يتكلم حوالي 70% وأنت تسأل. اللي يسأل يمسك المكالمة.",why:"عكس ما يسويه أغلب البائعين، ولهذا يفشلون."},
 {t:"mcq",q:"العميل ضغطك بالوقت: «عندي اجتماع بعد ربع ساعة». وش تسوي؟",o:["تتخطى الأسئلة وتقول السعر","تستخدم نسخة الـ15 دقيقة: نفس الخطوات بأسئلة أقل، ولا تحذف خطوة","تأجل المكالمة بدون موعد","تتكلم بسرعة عن الخدمة"],a:1,ex:"«بما إن وقتك ضيق، خلني أسألك 3 أسئلة وأقولك بصراحة إذا أقدر أفيدكم». اللي ينحذف هو عدد الأسئلة، مو الخطوات.",why:"الضغط بالوقت هو اللي خلاك تقفز خطوات في الجولة اللي جبت فيها 5."},
 {t:"mcq",q:"وش تسوي قبل المكالمة بـ10 دقائق؟",o:["ولا شيء","تحلل حسابه بالقالب وتطلّع ملاحظتين بأرقام، وتجهز ورقة الخانات الأربع، ومكان هادي","تجهز عرض بوربوينت","تكتب سعر جديد"],a:1,ex:"ملاحظتين بأرقام من حسابه، وورقة: الوضع، الألم، الهدف، كلماته بالضبط. وتذكّر: أنت جاي تشخّص، مو تبيع.",why:"التحضير يفرق بين مكالمة 5 ومكالمة 8."},
 {t:"mcq",q:"وش تسوي بعد المكالمة؟",o:["تنتظر العميل يكلمك","نفس اليوم ترسل العرض المكتوب، وخلال ساعة تكتب وش صار، وقبل الموعد بيوم تذكير","تنساها","ترسل 5 رسائل متابعة"],a:1,ex:"العرض يبدأ بقبل/بعد بكلماته. وإذا ما رد بعد 3 أيام: متابعة بسطر واحد بدون ضغط.",why:"المتابعة المنظمة تقفل صفقات كثيرة تضيع."}
 ]
},
{
 id:"objections", icon:"🛡️", title:"الاعتراضات", desc:"وافق، ثم اسأل، ثم رد",
 summary:[
  "القاعدة: وافق، ثم اسأل، ثم رد. الاعتراض غالبًا سؤال، مو رفض.",
  "«غالي» = ما شاف القيمة كفاية أو يقارنك بمونتير.",
  "«عندنا موظف» = خايف يدفع مرتين أو يحمي فريقه. أنت تساعد الموظف، مو بديل.",
  "«خلني أفكر» = فيه اعتراض ما قاله. اسأل وش هو.",
  "«وش يضمن لي؟» = خايف. اضمن شغلك، مو المبيعات.",
  "«الوكالة» = اسأل وش يسوون، وكن مكمّل مو منافس."
 ],
 qs:[
 {t:"order",q:"رتّب القاعدة الذهبية للرد على أي اعتراض:",o:["وافق","اسأل","رد"],ex:"الموافقة تشيل الدفاعية، والسؤال يكشف الاعتراض الحقيقي، والرد يجي على الشيء الصح.",why:"تطبقها على أي اعتراض حتى لو ما حفظت رده."},
 {t:"mcq",q:"العميل قال «غالي». وش أول شيء تقوله؟",o:["«خلاص أنزل لك السعر»","«أفهمك. خلني أسألك: تقارنه بإيش؟»","«لا، مو غالي»","تسكت وتقفل"],a:1,ex:"توافق وتسأل. الجواب يوريك هل يقارنك بمونتير أو بموظف أو بميزانية محددة، وكل وحدة لها رد.",why:"«غالي» أكثر اعتراض بتسمعه."},
 {t:"mcq",q:"بعد «تقارنه بإيش؟»، وش الرد على «غالي»؟",o:["«الفيديو حوالي 430 ريال شامل الفكرة والسكربت والمونتاج، وأقل من راتب موظف متخصص بدون توظيف ولا إدارة»","«كل الناس يدفعون كذا»","«السعر نهائي»","«أعطيك خصم 50%»"],a:0,ex:"تقسّم السعر على الفيديو، وتقارنه بالبديل الحقيقي (موظف متخصص). وإذا أصر: «فيه الأساسية، 8 فيديوهات بـ3,500».",why:"ما تنزل من سعرك، تنزل من الباقة."},
 {t:"mcq",q:"«المونتير يسويها بـ100 ريال للفيديو». وش ردك؟",o:["«أنا أفضل منه»","«صح، المونتير يمنتج الفيديو اللي تعطيه. أنا أبدأ قبله: وش ننزل، وليش، ولمين، والسكربت، ووش يتصور»","«أنزل لك لـ100»","«المونتير ما يعرف»"],a:1,ex:"توضح الفرق بين المونتاج وصناعة المحتوى بدون ما تهاجم المونتير. وتقدر تضيف: «والمونتير اللي عندكم ممكن نشتغل سوا».",why:"هذا جوهر تميّز خدمتك."},
 {t:"mcq",q:"«عندنا موظف يسوي المحتوى». وش يقصد غالبًا؟",o:["ما يحتاجك أبدًا","خايف يدفع مرتين، أو يحمي فريقه","يبي خصم","يبي يوظفك"],a:1,ex:"تسأل: «هو ماسك المحتوى بس، ولا معه أشياء ثانية؟» غالبًا معه أشياء كثيرة. ثم: «أنا ما أجي بديل له، أساعده. أشيل عنه التفكير والسكربت والمونتاج، وهو يصور نص ساعة».",why:"تحوّل الموظف من منافس إلى حليف."},
 {t:"mcq",q:"«خلني أفكر». وش أحسن رد؟",o:["«تمام، كلمني إذا قررت»","«أكيد، خذ راحتك. بس وش الشيء اللي تحتاج تفكر فيه؟ السعر، ولا التصوير، ولا تحتاج تكلم أحد؟»","«العرض ينتهي اليوم»","«ليش تفكر؟»"],a:1,ex:"«خلني أفكر» غالبًا يغطي اعتراض ما انقال. السؤال اللطيف يطلّعه، وبعدها تحدد موعد.",why:"أغلب الصفقات تموت هنا بصمت."},
 {t:"mcq",q:"«أرسل لي عرضك على الواتساب وخلاص». وش ردك؟",o:["ترسله وتنتظر","«أقدر، بس بيكون عام. لو أعطيتني 10 دقائق أفهم وضعكم، أرسل لك عرض مبني عليكم أنتم»","«ما أرسل عروض»","ترسل الملف بدون كلام"],a:1,ex:"يبي يخلص من المكالمة أو يقارن. العرض العام يخسر المقارنة، والعرض المبني عليه يفوز.",why:"تحوّل الرفض اللطيف إلى مكالمة حقيقية."},
 {t:"mcq",q:"«وش يضمن لي؟». وش ردك؟",o:["«أضمن لك 100 ألف مشاهدة»","«ما أقدر أضمن مبيعات، ولا أحد صادق يقدر. اللي أضمنه شغلي: 14 فيديو في مواعيدها، مدروسة، وتقرير شهري. وبدون عقد طويل»","«ثق فيني»","«إذا ما عجبك أرجع فلوسك كاملة»"],a:1,ex:"الصدق هنا يبني ثقة أكثر من أي وعد. تضمن اللي تتحكم فيه: الالتزام والجودة والشفافية. وشهر بشهر يقلل خوفه.",why:"الوعود الكبيرة ترجع عليك."},
 {t:"mcq",q:"«ما عندنا وقت نصور». وش ردك؟",o:["«خلاص ما نقدر نشتغل»","«التصوير نص ساعة بالأسبوع بالجوال، وأرسل تعليمات دقيقة: وش تصور، ومن أي زاوية، وكم ثانية. ما يحتاج كاميرا ولا خبرة»","«أنا أجي أصور»","«صوروا أي شيء»"],a:1,ex:"يتخيل التصوير شغلة كبيرة. الأرقام الصغيرة (نص ساعة، جوال) والتعليمات الدقيقة تشيل الخوف.",why:"التصوير في الموقع مو ضمن خدمتك، فلازم تقنعه إنه سهل."},
 {t:"mcq",q:"«عندنا وكالة، وش الفرق بينك وبينها؟». وش أول خطوة؟",o:["تهاجم الوكالة","توافق وتسأل: «ممتاز إن عندكم وكالة. وش اللي يسوونه لكم بالضبط؟»","تقول إنك أرخص","تقفل المكالمة"],a:1,ex:"السؤال يوريك وش ناقص عندهم. ثم: «الوكالة تدير الحساب وتسوي منشورات. أنا متخصص في الفيديو العقاري القصير: 14 فيديو مدروسة. يعني أكمّلهم، ما أنافسهم».",why:"ما تطلب منه يترك وكالته، فقراره أسهل."},
 {t:"mcq",q:"«نجرب فيديو واحد أول». وش ردك؟",o:["«تمام، فيديو واحد بـ500»","«أفهمك. بس فيديو واحد ما يوريك النتيجة، لأن الفرق يجي من الاستمرار والخطة. عشان كذا الاشتراك شهر بشهر: تجرب شهر كامل، وإذا ما عجبك ما تكمل»","«لا، لازم 3 شهور»","«مستحيل»"],a:1,ex:"يبي يقلل المخاطرة. شهر بشهر هو التجربة الآمنة، والفيديو الواحد ما يعطي صورة عادلة.",why:"تحمي قيمة خدمتك من التحول لبيع فيديو بالحبة."},
 {t:"tf",q:"الاعتراض غالبًا رفض نهائي، فالأفضل تنهي المكالمة بسرعة.",a:false,ex:"غلط. الاعتراض غالبًا سؤال أو خوف. العميل اللي يعترض مهتم، واللي ما يهمه ما يعترض أصلًا.",why:"تتعامل مع الاعتراض كفرصة توضيح."},
 {t:"mcq",q:"العميل قال «غالي» وأصر بعد ردك. وش الخطوة الجاية؟",o:["تنزل سعر النمو","تعرض الأساسية: «فيه الأساسية، 8 فيديوهات بـ3,500. بس بما إن عندكم مشروع جديد، 14 تعطيكم مساحة تغطونه صح»","تقفل المكالمة","تعطيه شهر مجاني"],a:1,ex:"تنزل في الكمية، مو في سعر الفيديو. وتربط النمو بهدفه عشان يبقى خيار.",why:"قاعدة تحفظ قيمتك."}
 ]
},
{

 summary:[
  "استبيان البداية (Brief): 7 أقسام وحوالي 20 سؤال قبل أول سكربت.",
  "رحلة العميل: من أول رسالة، إلى جلسة البداية، إلى الخطة، إلى التصوير والتسليم، إلى التقرير والتجديد.",
  "التقرير الشهري: وش اشتغل، ووش ما اشتغل، ووش نغير، مبني على صور الإحصائيات.",
  "التجديد يجي من التقرير: العميل يجدد لما يشوف التحسن بالأرقام.",
  "وثيقة العمل الحر تخليك تشتغل نظاميًا، وتفتح لك بوابات دفع مثل ميسّر.",

 ],
 qs:[
 {t:"mcq",q:"وش هدف «استبيان البداية» (Brief)؟",o:["تجمع كلمة مرور الحساب","تفهم الشركة وجمهورها وعقاراتها وأهدافها قبل أول سكربت","تاخذ الفلوس","ما له هدف"],a:1,ex:"بدونه تكتب سكربتات عامة. معه تكتب محتوى يشبه الشركة ويخاطب جمهورها الحقيقي.",why:"أول خطوة في رحلة كل عميل."},
 {t:"mcq",q:"متى يدفع العميل؟",o:["آخر الشهر","مقدمًا قبل بداية الشهر","بعد كل فيديو","بعد 3 شهور"],a:1,ex:"الدفع مقدمًا يحميك ويخلي العميل ملتزم. ما تبدأ الشغل قبل الدفع.",why:"قاعدة تحمي دخلك من البداية."},
 {t:"mcq",q:"وش أهم 3 أقسام في التقرير الشهري؟",o:["المتابعين، اللايكات، التعليقات","وش اشتغل، ووش ما اشتغل، ووش نغير الشهر الجاي","عدد الفيديوهات، التاريخ، السعر","ولا شيء، التقرير اختياري"],a:1,ex:"التقرير مو أرقام مرصوصة. هو قراءة: ليش هذا الفيديو نجح، ووش نسوي أكثر، ووش نوقف.",why:"التقرير هو الطبقة الثالثة (التعلّم) اللي تفرقك."},

 <div class="hero"><div class="k">${AR(s.m)} من ${AR(s.n)} متقَن · ${ulevel(s.p)}</div><div class="bar g" style="margin:8px 0 14px"><i style="width:${s.p}%"></i></div>
 ${(()=>{const lk=u.qs.filter(q=>q.d>maxD()).length;return lk?`<p style="font-size:13px;color:var(--mut);margin-bottom:10px">🔒 ${AR(lk)} أسئلة أصعب تنفتح لما يرتفع مستواك</p>`:""})()}<button class="btn" data-a="unitgo" data-u="${u.id}">${s.s?"⚡ كمّل الوحدة":"⚡ ابدأ بالغلط"}</button>
 <p style="font-size:13px;color:var(--mut);margin-top:10px">نصيحة: ابدأ بالأسئلة قبل الخلاصة. الغلط يخلي المعلومة تنحفر.</p></div>
 <h2>خلاصة الوحدة</h2><div class="sum"><ul>${u.summary.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
}
/* ---------- quiz ---------- */
let QZ=null;
function startQuiz(list,title){if(!list.length)return;QZ={queue:list.map(q=>({q,retry:false})),i:0,total:list.length,done:0,correct:0,combo:0,xp:0,title,newM:0,answered:false};renderQ();}
function renderQ(){
 view="quiz";window.scrollTo(0,0);
 const it=QZ.queue[QZ.i];if(!it)return renderEnd();
 const q=it.q;QZ.answered=false;QZ.order=[];
 let body="";
 if(q.t==="mcq"){QZ.map=shuffle(q.o.map((t,k)=>({t,k})));body=`<div class="opts">${QZ.map.map((x,j)=>`<button class="opt" data-o="${j}"><span class="n">${AR(j+1)}</span><span>${esc(x.t)}</span></button>`).join("")}</div>`;}
 else if(q.t==="tf"){body=`<div class="tf opts"><button class="opt" data-tf="1">✓ صح</button><button class="opt" data-tf="0">✗ غلط</button></div>`;}
 else{QZ.map=shuffle(q.o.map((t,k)=>({t,k})));body=`<p style="font-size:13px;color:var(--mut);margin-bottom:8px">اضغط على العناصر بالترتيب الصحيح</p><div class="opts ord">${QZ.map.map((x,j)=>`<button class="opt" data-r="${j}"><span class="n">·</span><span>${esc(x.t)}</span></button>`).join("")}</div><div class="actions"><button class="btn sec" data-a="ordreset">إعادة</button><button class="btn" data-a="ordcheck" id="oc" disabled>تحقق</button></div>`;}
 const pct=Math.round(QZ.done/QZ.total*100);
 app.innerHTML=`<div class="qtop"><button class="close" data-a="quit">×</button><div class="bar"><i style="width:${pct}%"></i></div><div class="combo">${QZ.combo>=2?"🔥×"+AR(QZ.combo):""}</div></div>
 <div class="qcard" id="qc"><span class="tag">${q.u.icon} ${esc(q.u.title)}${it.retry?" · إعادة":""}</span> <span class="tag" style="color:${DC[q.d]};background:rgba(255,255,255,.06)">${DN[q.d]}</span><div class="qtext">${esc(q.q)}</div>${body}<div id="fbx"></div></div>`;
}
function answer(ok,info){
 if(QZ.answered)return;QZ.answered=true;
 const it=QZ.queue[QZ.i],q=it.q,s=st(q.id),t=today();
 s.s=(s.s||0)+1;S.days[t]=(S.days[t]||0)+1;
 let gain=0;
 if(ok){
  QZ.combo++;
  if(!it.retry){const was=s.l;s.l=Math.min((s.l||0)+(s.lastOk===t?0:1),4);s.lastOk=t;s.w=0;s.d=addDays(t,[0,1,3,7,14][s.l]);if(was<2&&s.l>=2)QZ.newM++;gain=5+5*q.d+Math.min(QZ.combo-1,5)*2;QZ.correct++;}
  else{s.w=0;s.l=0;s.d=addDays(t,1);gain=5;}
 }else{
  QZ.combo=0;s.l=0;s.w=1;s.d=t;
  if(!it.retry||QZ.queue.filter(x=>x.q===q).length<3){const pos=Math.min(QZ.i+3,QZ.queue.length);QZ.queue.splice(pos,0,{q,retry:true});}
 }
 if(!it.retry)QZ.done++;
 const tb=tierIdx(overall().pf);QZ.xp+=gain;S.xp+=gain;persist();const ta=tierIdx(overall().pf);
 if(ta>tb){QZ.up=TIERS[ta];setTimeout(()=>flyXP("⬆️ صرت "+TIERS[ta][1]+"!"),300);}
 if(gain)flyXP("+"+gain);
 if(!ok)$("#qc").classList.add("shake");
 const correctTxt=q.t==="mcq"?q.o[q.a]:q.t==="tf"?(q.a?"صح":"غلط"):q.o.map((x,k)=>AR(k+1)+". "+x).join("\n");
 $("#fbx").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><h3>${ok?pickOk():"❌ "+pickBad()}</h3>
 ${ok?"":`<div class="ans">الصح: <span style="white-space:pre-line">${esc(correctTxt)}</span></div>`}
 <p>${esc(q.ex)}</p>${q.eg?`<span class="lbl">مثال</span><div class="eg">${esc(q.eg)}</div>`:""}${q.why?`<span class="lbl">ليش يهمك في شغلك؟</span><p style="margin:0">${esc(q.why)}</p>`:""}</div>
 <div class="actions">${OFFLINE?"":`<button class="ask" data-a="askq">ما فهمت؟ اسأل Claude</button>`}<button class="btn" data-a="next">${QZ.i+1<QZ.queue.length?"التالي ←":"النتيجة ←"}</button></div>`;
 setTimeout(()=>{const f=$("#fbx");if(f)f.scrollIntoView({behavior:"smooth",block:"nearest"});},60);
}
const OKS=["✅ صح! كفو","✅ بالضبط","✅ ممتاز، ركّزت","✅ صح، خبير قادم","✅ ضبطتها"];
const BADS=["غلط، وهذا زين: الحين بتنحفر","مو هذا، بس لاحظ ليش","قريب، شوف الصح","غلط، وبيرجع لك بعد شوي"];
const pickOk=()=>OKS[Math.floor(Math.random()*OKS.length)];
const pickBad=()=>BADS[Math.floor(Math.random()*BADS.length)];
function flyXP(t){const d=document.createElement("div");d.className="xp";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000);}
function renderEnd(){
 view="end";window.scrollTo(0,0);
 const pct=Math.round(QZ.correct/QZ.total*100),tc=todayCount();
 const em=pct>=80?"🏆":pct>=50?"💪":"🌱";
 app.innerHTML=`<div class="end"><div class="big">${em}</div><h1>${pct>=80?"أداء خبير!":pct>=50?"زين، كمّل":"بداية، والغلط تعلّم"}</h1>
 <div class="stats"><div class="stat"><b>${AR(QZ.correct)}/${AR(QZ.total)}</b><span>صح من أول مرة</span></div><div class="stat"><b>+${AR(QZ.xp)}</b><span>نقاط</span></div><div class="stat"><b>${AR(QZ.newM)}</b><span>أتقنت جديد</span></div></div>
 ${QZ.up?`<div class="note" style="text-align:right"><b>⬆️ ترقية!</b> صرت ${QZ.up[2]} ${QZ.up[1]}، وانفتحت لك أسئلة بصعوبة «${DN[maxD()]}».</div>`:""}<p style="color:var(--mut);margin:10px 0 18px">${tc>=20?"خلّصت هدف اليوم 🎯 (20 سؤال)":tc>=10?"اليوم انحسب في سلسلتك 🔥 · باقي "+AR(20-tc)+" لهدف اليوم":"باقي "+AR(10-tc)+" سؤال عشان اليوم ينحسب في السلسلة"}</p>
 <button class="btn" data-a="daily">⚡ جلسة ثانية</button><div class="row"><button class="btn sec" data-a="home">🏠 الرئيسية</button><button class="btn sec" data-a="wrong" ${wrongList().length?"":"disabled"}>🔁 أخطائي</button></div></div>`;
}
/* ---------- chat ---------- */
const CTX=`أنت مدرّب ومرشد لمحمد صميلي، مستقل سعودي يبني بزنس «صناعة المحتوى العقاري الشهري» للشركات العقارية في السعودية. يشتغل كفرد بأنظمة بمستوى وكالة، وهدفه يصير خبير خلال 30–40 يوم.
حقائق الخدمة: الجملة «أنقل حسابك من حساب يعرض عقارات، إلى حساب يثق فيه المشتري قبل ما يتصل، بدون ما تشيل هم المحتوى». الباقات شهر بشهر والدفع مقدمًا: الأساسية 3,500 ريال (8 فيديو)، النمو 6,000 ريال (14 فيديو + 5 كاروسيل). تشمل: خطة المحتوى، السكربتات، تعليمات التصوير بالجوال، المونتاج، التحليل والتقرير الشهري. ما تشمل: إدارة الحساب، الرد على العملاء، الإعلانات، التصوير في الموقع، ضمان مبيعات. العميل يصور نص ساعة بالأسبوع ويرسل صور الإحصائيات، وما نطلب كلمة مرور أبدًا. تعديل واحد لكل فيديو. عرض العميل المؤسس 2,500 لأول شهر مقابل دراسة حالة. العميل المثالي: شركة عقارية سعودية مرخّصة 4,000–50,000 متابع. المكالمة 8 خطوات: الإطار، الوضع، الألم، الهدف، التلخيص والملاحظة، الحل، السعر ثم السكوت، موعد محدد. الاعتراضات: وافق ثم اسأل ثم رد.
طريقتك: جاوب باللهجة السعودية البسيطة، بوضوح ودفء، كأنك تشرح لصاحبك. ابدأ بالجواب مباشرة، ثم مثال عملي من العقار السعودي، ثم سطر «وش تسوي فيها». خل الجواب قصير (4–8 أسطر) إلا إذا طلب تفصيل. لا تخترع أرقام أو أنظمة، وإذا ما تعرف قل كذا. نص عادي بدون جداول.`;
let CHAT=[],CHATQ=null,busy=false,CID=null;
if(!S.chats)S.chats=[];if(!S.later)S.later=[];
const CTX_SHORT="أنا محمد، مستقل سعودي أبني بزنس «صناعة المحتوى العقاري الشهري» للشركات العقارية (الأساسية 3,500 ريال 8 فيديو، النمو 6,000 ريال 14 فيديو + 5 كاروسيل، شهر بشهر). أتعلم عشان أصير خبير. جاوبني باللهجة السعودية، بوضوح ومثال عملي من العقار، وباختصار.";
function qctx(q){return q?`\n\nالسؤال اللي أتدرب عليه: «${q.q}»`+(q.o?`\nالخيارات: ${q.o.join(" | ")}`:"")+`\nالشرح: ${q.ex}`:"";}
function openChat(q){
 CHATQ=q||null;CHAT=[];CID=null;
 const sh=document.createElement("div");sh.className="sheet";sh.id="sheet";
 const chips=(q?["اشرحها لي بطريقة أبسط","أعطني مثال ثاني","ليش الخيارات الثانية غلط؟"]:["كيف أرد على «غالي»؟","اشرح لي منحنى الاستمرار","وش أقول في أول دقيقة من المكالمة؟"]);
 sh.innerHTML=`<div class="panel"><div class="ph"><span>💬 اسأل Claude${q?" عن هذا السؤال":""}</span><span style="display:flex;gap:6px"><button class="chip" data-a="hist">📜 السابقة</button><button class="chip" data-a="newchat">＋ جديدة</button><button class="close" data-a="closechat">×</button></span></div>
 <div class="msgs" id="msgs"></div>
 <div class="chips" id="chips">${chips.map(c=>`<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join("")}</div>
 <div class="cin"><textarea id="cin" placeholder="اكتب سؤالك…"></textarea><button data-a="send">${SAMPLE?"إرسال":"اسأل"}</button></div></div>`;
 document.body.appendChild(sh);renderMsgs();
}
function renderMsgs(){const m=$("#msgs");if(!m)return;
 if(!SAMPLE&&!CHAT.length){m.innerHTML=`<div class="m ai">هنا ما أقدر أجاوبك داخل التطبيق. اكتب سؤالك:
• إذا فيه نت: يفتح لك Claude والسؤال جاهز، والمحادثة تنحفظ في حسابك.
• إذا ما فيه نت: ينحفظ هنا وتسأله لما يجي النت.</div>`+laterHTML();m.scrollTop=0;return;}
 m.innerHTML=CHAT.map(x=>`<div class="m ${x.role==="user"?"me":"ai"}">${esc(x.content)}</div>`).join("")||`<div class="m ai">هلا محمد 👋 اسألني أي شي عن البزنس: الخدمة، العميل، المكالمة، المشاهدات، التحليل…</div>`;m.scrollTop=m.scrollHeight;}
function laterHTML(){if(!S.later.length)return"";return`<div style="font-weight:900;margin-top:6px">📌 أسئلة محفوظة (${AR(S.later.length)})</div>`+S.later.map((x,i)=>`<div class="m ai" style="align-self:stretch;max-width:100%">${esc(x.t)}<div style="display:flex;gap:6px;margin-top:8px"><button class="chip" data-a="laterask" data-i="${i}">اسأل الحين</button><button class="chip" data-a="laterdel" data-i="${i}">حذف</button></div></div>`).join("");}
function external(text,q){
 const p=CTX_SHORT+qctx(q)+"\n\nسؤالي: "+text;
 if(navigator.onLine){window.open("https://claude.ai/new?q="+encodeURIComponent(p),"_blank");return true;}
 S.later.unshift({t:text,q:q?q.id:null,d:today()});S.later=S.later.slice(0,50);persist();flyXP("📌 انحفظ");renderMsgs();return false;
}
function saveChat(){
 if(!CHAT.length)return;
 if(!CID){CID=Date.now().toString(36);S.chats.unshift({id:CID,d:today(),title:CHAT[0].content.slice(0,70),q:CHATQ?CHATQ.id:null,m:CHAT.slice()});}
 else{const c=S.chats.find(x=>x.id===CID);if(c)c.m=CHAT.slice();}
 S.chats=S.chats.slice(0,40);persist();
}
function showHist(){const m=$("#msgs");if(!m)return;const ch=$("#chips");if(ch)ch.classList.add("hide");
 m.innerHTML=S.chats.length?`<div style="font-weight:900">📜 محادثاتك السابقة</div>`+S.chats.map(c=>`<button class="m ai" style="align-self:stretch;max-width:100%;text-align:right" data-a="loadchat" data-id="${c.id}"><b>${esc(c.title)}</b><br><span style="font-size:12px;color:var(--mut)">${esc(c.d)} · ${AR(c.m.length)} رسالة</span></button>`).join(""):`<div class="m ai">ما فيه محادثات محفوظة للحين.</div>`;
 if(!SAMPLE)m.innerHTML+=laterHTML();}
async function send(text){
 text=(text||"").trim();if(!text||busy)return;
 if(!SAMPLE){external(text,CHATQ);return;}
 busy=true;const ch=$("#chips");if(ch)ch.classList.add("hide");
 CHAT.push({role:"user",content:text});CHAT.push({role:"assistant",content:"…"});renderMsgs();
 const first=CTX+qctx(CHATQ);
 const msgs=CHAT.slice(0,-1).map((x,i)=>i===0?{role:"user",content:first+"\n\nسؤال محمد: "+x.content}:x);
 try{
  const r=await SAMPLE(msgs,{cache:false,onText:({text})=>{CHAT[CHAT.length-1].content=text||"…";renderMsgs();}});
  CHAT[CHAT.length-1].content=r.text||"…";saveChat();
 }catch(e){CHAT.pop();CHAT.pop();CHAT.push({role:"assistant",content:e&&e.code==="rate_limited"?"وصلنا للحد مؤقتًا، جرب بعد شوي.":"ما قدرت أجاوب الحين. تأكد من النت وجرب مرة ثانية."});}
 busy=false;renderMsgs();
}
function bkModal(title,txt,val,imp){const sh=document.createElement("div");sh.className="sheet";sh.id="sheet";sh.innerHTML=`<div class="panel" style="height:auto;max-height:88vh"><div class="ph"><span>${title}</span><button class="close" data-a="closechat">×</button></div><div style="padding:14px 16px;display:flex;flex-direction:column;gap:10px"><p style="font-size:14px;color:var(--mut)">${txt}</p><textarea id="bkt" style="background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:10px;height:140px;font-family:monospace;font-size:12px;direction:ltr" ${imp?"":"readonly"}>${esc(val)}</textarea>${imp?`<button class="btn" data-a="doimp">استرجاع</button>`:`<button class="btn" data-a="copybk">نسخ</button>`}<p id="bkmsg" style="font-size:13px;color:var(--y)"></p></div></div>`;document.body.appendChild(sh);}
function alertBox(m){const p=$("#bkmsg");if(p)p.textContent=m;}
/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-a],[data-u],[data-o],[data-tf],[data-r],[data-chip]");if(t&&t.dataset.a==="hist"){showHist();return;}if(t&&t.dataset.a==="newchat"){const s0=$("#sheet");if(s0)s0.remove();openChat(null);return;}if(t&&t.dataset.a==="loadchat"){const c=S.chats.find(x=>x.id===t.dataset.id);if(c){CHAT=c.m.slice();CID=c.id;CHATQ=c.q?Q[c.q]:null;renderMsgs();}return;}if(t&&t.dataset.a==="laterask"){const x=S.later[+t.dataset.i];if(x&&external(x.t,x.q?Q[x.q]:null)){S.later.splice(+t.dataset.i,1);persist();renderMsgs();}return;}if(t&&t.dataset.a==="laterdel"){S.later.splice(+t.dataset.i,1);persist();renderMsgs();return;}if(!t)return;
 if(t.dataset.chip){send(t.dataset.chip);return;}
 if(t.dataset.o!==undefined&&view==="quiz"){if(QZ.answered)return;const j=+t.dataset.o,q=QZ.queue[QZ.i].q,x=QZ.map[j],ok=x.k===q.a;
  document.querySelectorAll("[data-o]").forEach((b,k)=>{const kk=QZ.map[k].k;b.classList.add(kk===q.a?"ok":k===j?"bad":"dim");});answer(ok);return;}
 if(t.dataset.tf!==undefined&&view==="quiz"){if(QZ.answered)return;const q=QZ.queue[QZ.i].q,v=t.dataset.tf==="1",ok=v===q.a;
  document.querySelectorAll("[data-tf]").forEach(b=>{const bv=b.dataset.tf==="1";b.classList.add(bv===q.a?"ok":b===t?"bad":"dim");});answer(ok);return;}
 if(t.dataset.r!==undefined&&view==="quiz"){if(QZ.answered)return;const j=+t.dataset.r;if(QZ.order.includes(j))return;QZ.order.push(j);t.classList.add("picked");t.querySelector(".n").textContent=AR(QZ.order.length);if(QZ.order.length===QZ.map.length)$("#oc").disabled=false;return;}
 if(t.dataset.u&&!t.dataset.a){renderUnit(t.dataset.u);return;}
 const a=t.dataset.a;
 if(a==="exp"){const code="ACAD1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{navigator.clipboard.writeText(code).catch(()=>{});}catch(e){}bkModal("💾 تقدمك منسوخ","انسخ النص هذا كامل وأرسله لنفسك (واتساب مثلًا). في الجهاز الثاني اضغط «استرجاع تقدمي» والصقه.",code,false);}
 else if(a==="imp"){bkModal("📥 استرجاع تقدمي","الصق النص اللي نسخته من جهازك الثاني، واضغط استرجاع. تنبيه: يستبدل التقدم الحالي في هذا الجهاز.","",true);}
 else if(a==="doimp"){const v=($("#bkt").value||"").trim();try{if(!v.startsWith("ACAD1:"))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(6)))));if(!o.q)throw 0;S=o;norm();persist();$("#sheet").remove();renderHome();flyXP("✅ رجع تقدمك");}catch(e){alertBox("النص مو صحيح. تأكد إنك نسخته كامل.");}}
 else if(a==="intro"){S.intro=true;persist();renderHome();}
 else if(a==="home")renderHome();
 else if(a==="daily")startQuiz(buildDaily(),"جلسة اليوم");
 else if(a==="wrong")startQuiz(shuffle(wrongList()).slice(0,15),"مراجعة أخطائي");
 else if(a==="rand")startQuiz(shuffle(ALL).slice(0,10),"عشوائي");
 else if(a==="unitgo"){const u=UNITS.find(x=>x.id===t.dataset.u);startQuiz(buildUnit(u),u.title);}
 else if(a==="quit"){renderHome();}
 else if(a==="next"){QZ.i++;renderQ();}
 else if(a==="ordreset"){if(QZ.answered)return;QZ.order=[];document.querySelectorAll("[data-r]").forEach(b=>{b.classList.remove("picked");b.querySelector(".n").textContent="·";});$("#oc").disabled=true;}
 else if(a==="ordcheck"){if(QZ.answered)return;const ok=QZ.order.every((j,i)=>QZ.map[j].k===i);
  document.querySelectorAll("[data-r]").forEach((b,k)=>{const pos=QZ.order.indexOf(k);b.classList.add(QZ.map[k].k===pos?"ok":"bad");});$("#oc").disabled=true;answer(ok);}
 else if(a==="askq"){openChat(QZ.queue[QZ.i].q);}
 else if(a==="copybk"){const t=$("#bkt");t.select();try{navigator.clipboard.writeText(t.value).catch(()=>{});}catch(e){document.execCommand("copy");}alertBox("✅ انسخ");}
 else if(a==="closechat"){const s=$("#sheet");if(s)s.remove();}
 else if(a==="send"){const c=$("#cin");send(c.value);c.value="";}
});
$("#fab").addEventListener("click",()=>openChat(null));
document.addEventListener("keydown",e=>{if(e.target.id==="cin"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(e.target.value);e.target.value="";}});
renderHome();

})();
</script>
