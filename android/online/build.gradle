plugins { id 'com.android.application' }
android {
    namespace 'com.mohd.academyonline'
    compileSdk 34
    defaultConfig {
        applicationId "com.mohd.academyonline"
        minSdk 21
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.browser:browser:1.8.0' }
